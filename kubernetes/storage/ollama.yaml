apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama
spec:
  storageClassName: local-storage
  claimRef:
    name: ollama
    namespace: sotongpt
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: /opt/sotongpt-data/ollama
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - srv04885
