apiVersion: v1
kind: PersistentVolume
metadata:
  name: openwebui
spec:
  storageClassName: local-storage
  claimRef:
    name: openwebui
    namespace: sotongpt
  capacity:
    storage: 32Gi
  accessModes:
    - ReadWriteMany
  local:
    path: /opt/sotongpt-data/openwebui
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - srv04885
