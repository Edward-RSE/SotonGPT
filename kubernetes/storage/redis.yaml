apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-valkey
spec:
  storageClassName: manual
  claimRef:
    name: redis-valkey
    namespace: sotongpt
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /opt/sotongpt-data/redis-valkey
    type: DirectoryOrCreate
