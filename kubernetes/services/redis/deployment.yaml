apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-valkey
  namespace: sotongpt
  labels:
    app: redis-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-valkey
  template:
    metadata:
      labels:
        app: redis-valkey
    spec:
      containers:
        - name: redis-valkey
          image: valkey/valkey:8.0.3-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 3gb
            - --maxmemory-policy
            - noeviction
            - --protected-mode
            - "no"
            - --maxclients
            - "1000"
            - --timeout
            - "0"
            - --save
            - ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis-valkey
              containerPort: 6379
          volumeMounts:
            - name: lv-storage
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: lv-storage
          persistentVolumeClaim:
            claimName: redis-valkey
