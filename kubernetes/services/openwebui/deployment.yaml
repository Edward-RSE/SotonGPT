apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: sotongpt
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      # main container won't start if a postgres connection cannot be made or if
      # the pipelines container isn't working
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo waiting; sleep 2; done;",
            ]
      containers:
        # Core service container, which runs Open WebUI
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.11.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: redis-secret
            - secretRef:
                name: openwebui-secret
            - secretRef:
                name: hf-token-secret
            - configMapRef:
                name: openwebui
          # The env variables in here use references to secrets and other config maps
          # so have to be here. Additional env variables are in the openwebui config
          # map
          env:
            # Migrations should only be enabled on one replica
            - name: ENABLE_DB_MIGRATIONS
              value: "False"
            # Secret key, need to set this to coordinate replicas and muiltiple workers
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: WEBUI_SECRET_KEY
            # Secret for Oauth SSO
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: OAUTH_CLIENT_SECRET
            # Configure Redis connection
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-valkey:6379/0
            - name: WEBSOCKET_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-valkey:6379/1
            # Configure postgres database connection
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-cnpg-app
                  key: username
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-cnpg-app
                  key: dbname
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cnpg-app
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-cnpg-rw:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 4
              memory: 8Gi
            limits:
              cpu: 4
              memory: 16Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: openwebui-storage
              mountPath: /app/backend/data
      volumes:
        - name: openwebui-storage
          persistentVolumeClaim:
            claimName: openwebui
