apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-deployment
  namespace: sotongpt
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      # main container won't start if a postgres connection cannot be made
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres-service 5432; do echo waiting; sleep 2; done;",
            ]
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.8.12
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: redis-secret
            - secretRef:
                name: openwebui-secret
            - secretRef:
                name: hf-token-secret
            - configMapRef:
                name: openwebui-config
          # The env variables in here use references to secrets and other config maps
          # so have to be here. Additional env variables are in the openwebui config
          # map
          env:
            # Secret key, need to set this to coordinate replicas and muiltiple workers
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: WEBUI_SECRET_KEY
            # Migrations should only be enabled on one replica
            - name: ENABLE_DB_MIGRATIONS
              value: "False"
            # Configure Redis connection
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-valkey-service:6379/0
            - name: WEBSOCKET_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis-valkey-service:6379/1
            # Configure postgres database connection
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 4
              memory: 1Gi
            limits:
              cpu: 4
              memory: 4Gi
          volumeMounts:
            - name: openwebui-storage
              mountPath: /app/backend/data
      volumes:
        - name: openwebui-storage
          persistentVolumeClaim:
            claimName: openwebui-pvc
