apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-volume
spec:
  storageClassName: manual
  claimRef:
    name: postgres-pvc
    namespace: sotongpt
  capacity:
    storage: 128Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /opt/sotongpt-data/postgresql
    type: DirectoryOrCreate
