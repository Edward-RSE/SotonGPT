apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ .Values.model.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: vllm-{{ .Values.model.name }}
spec:
  type: ClusterIP
  selector:
    app: vllm-{{ .Values.model.name }}
  ports:
    - name: http
      port: 80
      targetPort: 8000
