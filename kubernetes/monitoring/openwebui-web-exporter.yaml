apiVersion: v1
kind: Secret
metadata:
  name: openwebui-web-exporter-secret
  namespace: sotongpt
type: Opaque
stringData:
  OPENWEBUI_BASE_URL: "http://openwebui:8080"
  OPENWEBUI_API_KEY: "sk-ea64e6826dfc4dba9a84c5e4b97a35bb"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-web-exporter-model-prices
  namespace: sotongpt
data:
  model_prices.csv: |
    model,provider,input_per_1m,output_per_1m,cache_read_per_1m,cache_write_per_1m
    qwen3-6-35b-reasoning,openai,0.1233,1.069,0.1233,1.069
    qwen3-6-35b-non-reasoning,openai,0.1233,1.069,0.1233,1.069
    qwen3-32b,openai,0.1129,0.3704,0.1129,0.3704
    llama-3-3-70b,openai,0.2822,0.5866,0.2822,0.5866
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-web-exporter
  namespace: sotongpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui-web-exporter
  template:
    metadata:
      labels:
        app: openwebui-web-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: exporter
        image: ghcr.io/baselhusam/open-webui-exporter:latest
        ports:
          - containerPort: 9090
        envFrom:
        - secretRef:
            name: openwebui-web-exporter-secret
        env:
          - name: EXPORTER_PORT
            value: "9090"
          - name: COST_PER_1K_INPUT_TOKENS
            value: "0"
          - name: COST_PER_1K_OUTPUT_TOKENS
            value: "0"
          - name: MODEL_PRICES_CSV
            value: "/etc/openwebui-web-exporter/model_prices.csv"
        volumeMounts:
          - name: model-prices
            mountPath: /etc/openwebui-web-exporter
            readOnly: true
      volumes:
        - name: model-prices
          configMap:
            name: openwebui-web-exporter-model-prices
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-web-exporter
  namespace: sotongpt
  labels:
    app: openwebui-web-exporter
spec:
  selector:
    app: openwebui-web-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openwebui-web-exporter
  namespace: sotongpt
spec:
  selector:
    matchLabels:
      app: openwebui-web-exporter
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
