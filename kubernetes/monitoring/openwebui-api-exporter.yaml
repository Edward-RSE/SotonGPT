apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-api-exporter-pricing
  namespace: sotongpt
data:
  # pricing data taken from, e.g., https://openrouter.ai/meta-llama/llama-3.3-70b-instruct
  pricing.yaml: |
    currency: GBP
    default:
      prompt_per_1m: 0.0
      completion_per_1m: 0.0
    models:
      qwen3-6-35b-reasoning:
        prompt_per_1m: 0.1233
        completion_per_1m: 1.069
      qwen-3-6-35b-non-reasoning:
        prompt_per_1m: 0.1233
        completion_per_1m: 1.069
      qwen3-32b:
        prompt_per_1m: 0.1129
        completion_per_1m: 0.3704
      llama-3-3-70b:
        prompt_per_1m: 0.2822
        completion_per_1m: 0.5866
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-api-exporter
  namespace: sotongpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui-api-exporter
  template:
    metadata:
      labels:
        app: openwebui-api-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: exporter
          image: ghcr.io/edward-rse/openwebui-api-exporter:0.2.0
          ports:
            - containerPort: 9090
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: POLL_INTERVAL_SECONDS
              value: "30"
            - name: POLL_BATCH_SIZE
              value: "5000"
            - name: ALLOWED_EMAIL_DOMAINS
              value: "soton.ac.uk,southampton.ac.uk,ecs.soton.ac.uk"
            - name: PRICING_FILE
              value: "/etc/exporter/pricing.yaml"
            - name: UNHEALTHY_AFTER_SECONDS
              value: "300"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: pricing
              mountPath: /etc/exporter
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: pricing
          configMap:
            name: openwebui-api-exporter-pricing
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-api-exporter
  namespace: sotongpt
  labels:
    app: openwebui-api-exporter
spec:
  selector:
    app: openwebui-api-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openwebui-api-exporter
  namespace: sotongpt
spec:
  selector:
    matchLabels:
      app: openwebui-api-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
