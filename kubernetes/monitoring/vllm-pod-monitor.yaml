apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm
  namespace: sotongpt
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - sotongpt
  selector:
    matchLabels:
      monitoring: vllm
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 5s
      scheme: http

