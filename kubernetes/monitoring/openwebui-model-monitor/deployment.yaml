apiVersion: apps/v1
kind: Deployment
metadata:
  name: sotongpt-model-monitor
  namespace: sotongpt
  labels:
    app: sotongpt-model-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sotongpt-model-monitor
  template:
    metadata:
      labels:
        app: sotongpt-model-monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: exporter-script
          image: python:3.11-slim
          command: ["python", "/scripts/exporter.py"]
          ports:
            - containerPort: 8000
              name: metrics
          env:
            - name: API_URL
              value: http://sotongpt.soton.ac.uk/api/models
            - name: SCRAPE_INTERVAL
              value: "60"
            - name: API_TIMEOUT
              value: "10"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: SOTONGPT_API_KEY
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: "/metrics"
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: script
          configMap:
            name: sotongpt-model-monitor-exporter
