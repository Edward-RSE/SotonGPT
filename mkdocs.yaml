site_name: SotonGPT
site_description: Documentation for SotonGPT
docs_dir: docs/website

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

plugins:
  - search
  - awesome-pages
  - mkdocstrings
  - git-revision-date-localized

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - attr_list
  - tables

nav:
  - Home: index.md
